services:
  - type: web
    name: mg-mart-server
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @mg-mart/server run build
    startCommand: pnpm --filter @mg-mart/server run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_CUSTOM_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_CUSTOM_SEARCH_ENGINE_ID
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: MAX_IMAGES_PER_PRODUCT
        value: "5"
      - key: IMAGE_QUALITY_THRESHOLD
        value: "0.7"
      - key: PROCESSING_TIMEOUT_MS
        value: "30000"
